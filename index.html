<!DOCTYPE html>
<html lang="es">
<head>

    <title>Para vos 🌸</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="music-player-container">
        <span style="font-size: 0.85rem; color: #444; font-family: 'Georgia', serif;">🎵 Hey Jude</span>
        <audio id="bg-music" controls loop>

    <div id="main-container">
        <div id="garden-area">
            <button id="portal-button" onclick="handlePortalClick()">Toca acá 🌸</button>
        </div>
    </div>

    <a href="https://www.youtube.com/watch?v=VIcPndA0Bxk" target="_blank" class="youtube-btn">
        🎥 Ver video
    </a>

    <button id="more-texts-button" onclick="generateMoreTexts()">Más textos ✨</button>

    <script src="script.js"></script>
</body>
</html>
